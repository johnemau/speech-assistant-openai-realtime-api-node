- name: study-room-available-rooms
  vars:
      user_prompt: |
          Study room data:
          [
            {"room": "Room 101", "capacity": 4, "available": true, "start": "2026-04-06T14:00:00", "end": "2026-04-06T16:00:00"},
            {"room": "Room 102", "capacity": 1, "available": true, "start": "2026-04-06T14:00:00", "end": "2026-04-06T15:00:00"},
            {"room": "Room 201", "capacity": 6, "available": true, "start": "2026-04-06T15:00:00", "end": "2026-04-06T17:00:00"},
            {"room": "Room 202", "capacity": 2, "available": false, "start": null, "end": null}
          ]

          List the top most recent available rooms and times with a capacity of 2.
  assert:
      - type: llm-rubric
        value: >
            Mentions at least one room with capacity >= 2 that is available
            (Room 101 or Room 201), does not mention the single-person Room 102,
            and the summary is concise and easy to understand over the phone.

- name: study-room-no-available-rooms
  vars:
      user_prompt: |
          Study room data:
          [
            {"room": "Room 101", "capacity": 4, "available": false, "start": null, "end": null},
            {"room": "Room 202", "capacity": 2, "available": false, "start": null, "end": null}
          ]

          List the top most recent available rooms and times with a capacity of 2.
  assert:
      - type: llm-rubric
        value: >
            Clearly states that no rooms with capacity of 2 or more are currently
            available, and the response is brief and phone-friendly.

- name: study-room-filters-small-capacity
  vars:
      user_prompt: |
          Study room data:
          [
            {"room": "Cubicle A", "capacity": 1, "available": true, "start": "2026-04-06T13:00:00", "end": "2026-04-06T18:00:00"},
            {"room": "Cubicle B", "capacity": 1, "available": true, "start": "2026-04-06T13:00:00", "end": "2026-04-06T18:00:00"},
            {"room": "Group Room 3", "capacity": 8, "available": true, "start": "2026-04-06T16:00:00", "end": "2026-04-06T18:00:00"}
          ]

          List the top most recent available rooms and times with a capacity of 2.
  assert:
      - type: llm-rubric
        value: >
            Mentions Group Room 3 (capacity 8, available), does not mention
            the single-person cubicles, and gives the available time window.

- name: study-room-failure-reason-payload
  vars:
      user_prompt: |
          Study room data:
          The study room booking system returned an error: "Service temporarily unavailable. Please try again later."

          List the top most recent available rooms and times with a capacity of 2.
  assert:
      - type: llm-rubric
        value: >
            Acknowledges that room availability could not be retrieved and
            conveys it in a friendly, phone-appropriate tone without technical jargon.
